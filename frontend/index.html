<html lang="en">

    <meta name="description" content="FarmerAssist — an AI assistant for farmers. Ask about crops, pests, soil and schemes in Tamil, English or Tanglish." />

    <title>FarmerAssist</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
