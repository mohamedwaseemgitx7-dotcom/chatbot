# Keeps the Render free instance awake: it sleeps after 15 min without traffic, and waking takes 30–60 s
# (once it got stuck asleep until a manual restart). Pinging every 10 min keeps it running; one service
# running all month stays inside Render's free 750 instance-hours. /api/health/ready also runs one small
# Supabase query, so the database never pauses either.
# Note: GitHub disables scheduled workflows after 60 days without repository activity — re-enable it in
# the Actions tab (or push any commit) if that email arrives.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API readiness
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
            https://farmerassist-api.onrender.com/api/health/ready
